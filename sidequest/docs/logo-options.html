<meta charset="utf-8">
<style>
  body { background:#fffaf4; font:14px "Segoe UI",system-ui; color:#1f1712; margin:0; padding:36px; }
  h1 { font-size:15px; letter-spacing:.08em; text-transform:uppercase; color:#9a8879; margin:0 0 24px; }
  .row { display:flex; gap:34px; flex-wrap:wrap; }
  .card { background:#fff; border:1px solid #f2e4d5; border-radius:14px; padding:20px; width:250px; }
  .big { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .name { font-weight:800; font-size:21px; letter-spacing:-.03em; }
  .small { display:flex; align-items:center; gap:14px; padding-top:12px; border-top:1px solid #f2e4d5; }
  .cap { font:600 11px/1.4 ui-monospace,monospace; color:#9a8879; margin-top:10px; }
</style>
<h1>Sidequest — logo options</h1>
<div class="row" id="row"></div>
<script>
const G = `<defs><linearGradient id="g%ID%" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9f1c"/><stop offset="1" stop-color="#f4552c"/></linearGradient></defs>`;
const MARKS = [
  ["A · Quest marker",
   `<circle cx="16" cy="16" r="15" fill="url(#g%ID%)"/>
    <path d="M16 7.6 L16 17.4" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="16" cy="23" r="1.9" fill="#fff"/>`,
   "the RPG '!' — an offer, not a warning"],
  ["B · Pin + spark",
   `<circle cx="16" cy="16" r="15" fill="url(#g%ID%)"/>
    <path d="M16 24.5c0-4.4 5-6.6 5-10.6a5 5 0 0 0-10 0c0 4 5 6.2 5 10.6z" fill="#fff"/>
    <circle cx="16" cy="13.6" r="2.1" fill="#f4552c"/>`,
   "a map pin, but rounded and friendly"],
  ["C · Compass rose, off-axis",
   `<circle cx="16" cy="16" r="15" fill="url(#g%ID%)"/>
    <path d="M20.5 11.5 L17.6 17.6 L11.5 20.5 L14.4 14.4 Z" fill="#fff"/>`,
   "a needle pointing somewhere other than north"],
  ["D · Two days",
   `<circle cx="16" cy="16" r="15" fill="url(#g%ID%)"/>
    <rect x="8.5" y="11" width="7" height="11" rx="2.2" fill="#fff" opacity=".55"/>
    <rect x="16.5" y="9" width="7" height="13" rx="2.2" fill="#fff"/>`,
   "Saturday and Sunday, one taller"],
  ["E · The turn",
   `<circle cx="16" cy="16" r="15" fill="url(#g%ID%)"/>
    <path d="M11 25 V6" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".38"/>
    <path d="M11 20 C11 14.6 14.4 12.2 20.2 11.8" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M16.8 8 L21.2 11.7 L16.9 15.4" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>`,
   "current — the road you were on, and the turn off it"],
  ["F · Constellation",
   `<circle cx="16" cy="16" r="15" fill="url(#g%ID%)"/>
    <path d="M10 20 L14.5 12.5 L21.5 15 L19 22" fill="none" stroke="#fff" stroke-width="1.5" opacity=".6" stroke-linejoin="round"/>
    <circle cx="10" cy="20" r="2" fill="#fff"/><circle cx="14.5" cy="12.5" r="2.6" fill="#fff"/>
    <circle cx="21.5" cy="15" r="2" fill="#fff"/><circle cx="19" cy="22" r="1.6" fill="#fff"/>`,
   "places joined into a route — the plan itself"],
];
document.getElementById("row").innerHTML = MARKS.map(([t, body, cap], i) => {
  const svg = (size) => `<svg width="${size}" height="${size}" viewBox="0 0 32 32">${(G + body).replaceAll("%ID%", i)}</svg>`;
  return `<div class="card">
    <div class="big">${svg(44)}<span class="name">Sidequest</span></div>
    <div class="small">${svg(28)}${svg(20)}${svg(16)}<span style="font-size:11px;color:#9a8879">28 · 20 · 16px</span></div>
    <div class="cap">${t}<br>${cap}</div>
  </div>`;
}).join("");
</script>
